# Single-container MIRA dev compose that bind-mounts all three local repos
# (MIRA, Mira-nf, mira-oxide) into the live `mira` container for testing.
#
# Layout inside the container:
#   /MIRA/backend, /MIRA/frontend  -> live MIRA API + React code (this repo)
#   /MIRA-NF                       -> live Mira-nf Nextflow pipeline code
#   /MIRA-NF/sandboxes/...mira-oxide/app/mira-oxide -> locally built mira-oxide binary
#
# The pipeline runs in-container via `-profile mira_nf_container` (singularity), so the
# mira-oxide processes execute the baked sandbox binary at
# /MIRA-NF/sandboxes/cdcgov-mira-oxide-v1.5.10/app/mira-oxide -- we override just that file.
#
# Prereqs:
#   1. `mira:latest` image present (linux/amd64).
#   2. Local mira-oxide binary built for linux/amd64 at
#      ../mira-oxide/target/dev-linux/mira-oxide
#      (docker build --platform linux/amd64 -t mira-oxide:dev-local ../mira-oxide, then
#       docker cp the /app/mira-oxide binary out).
#   3. ${HOME}/mira-local-data exists.
#
# Bring up:  docker compose -f docker-compose-dev-ben.yml up -d
# Tear down: docker compose -f docker-compose-dev-ben.yml down

x-mira-image:
  &mira-image
  mira:latest

services:
  mira:
    container_name: mira
    image: *mira-image
    networks:
      - mira
    privileged: true
    ports:
      - 5175:5175
      - 8080:8080
    restart: always
    environment:
      # Force file polling so live edits under the bind mounts trigger reloads
      CHOKIDAR_USEPOLLING: "true"
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      # Data volume
      - type: bind
        source: ${HOME}/mira-local-data
        target: /data

      # Live MIRA backend + frontend (this repo)
      - type: bind
        source: ./backend
        target: /MIRA/backend
      - type: bind
        source: ./frontend
        target: /MIRA/frontend
      # Keep the image's frontend node_modules (host copy may be absent/wrong arch)
      - type: volume
        target: /MIRA/frontend/node_modules

      # Live Mira-nf pipeline code (sibling repo)
      - type: bind
        source: ../Mira-nf
        target: /MIRA-NF
      # Preserve the image's baked singularity sandboxes, which are NOT in the repo.
      # An anonymous volume seeds itself from the image content at this path.
      - type: volume
        target: /MIRA-NF/sandboxes

      # Live mira-oxide: override just the compiled binary inside the sandbox with the
      # locally built linux/amd64 binary. Read-only so the container can't clobber it.
      - type: bind
        source: ../mira-oxide/target/dev-linux/mira-oxide
        target: /MIRA-NF/sandboxes/cdcgov-mira-oxide-v1.5.10/app/mira-oxide
        read_only: true

    working_dir: /data

networks:
  mira:
    name: mira
