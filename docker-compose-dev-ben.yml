# Single-container MIRA dev compose that bind-mounts all three local repos
# (MIRA, Mira-nf, mira-oxide) into the live `mira` container for testing.
#
# Layout inside the container:
#   /MIRA/backend, /MIRA/frontend  -> live MIRA API + React code (this repo)
#   /MIRA-NF                       -> live Mira-nf Nextflow pipeline code
#   /opt/mira-oxide-dev/mira-oxide -> locally built mira-oxide binary
#
# The pipeline runs in-container via `-profile mira_nf_container` (singularity). singularity
# mounts each sandbox DIRECTORY as the container root and reads the sandbox's underlying
# (baked v1.5.10) mira-oxide. Nextflow launches singularity with `env -`, stripping
# SINGULARITY_BIND, so we expose the local binary at a neutral path and set MIRA_OXIDE_DEV_BIND
# (below); the mira_nf_container profile appends it as a `-B` run option to overlay our binary
# over /app/mira-oxide for every sandbox exec.
#
# Prereqs:
#   1. `mira:latest` image present (linux/amd64).
#   2. Local mira-oxide binary built for linux/amd64 at
#      ../mira-oxide/target/dev-linux/mira-oxide
#      (docker build --platform linux/amd64 -t mira-oxide:dev-local ../mira-oxide, then
#       docker cp the /app/mira-oxide binary out).
#   3. ${HOME}/mira-local-data exists.
#
# Bring up:  docker compose -f docker-compose-dev-ben.yml up -d
# Tear down: docker compose -f docker-compose-dev-ben.yml down

x-mira-image:
  &mira-image
  mira:latest

services:
  mira:
    container_name: mira
    image: *mira-image
    networks:
      - mira
    privileged: true
    ports:
      - 5176:5175
      - 8081:8080
    restart: always
    environment:
      # Force file polling so live edits under the bind mounts trigger reloads
      CHOKIDAR_USEPOLLING: "true"
      WATCHFILES_FORCE_POLLING: "true"
      # Make singularity run the locally-built mira-oxide. Nextflow launches singularity with
      # `env -`, which strips SINGULARITY_BIND, so the overlay cannot be passed via that env
      # var. Instead the mira_nf_container profile reads MIRA_OXIDE_DEV_BIND and appends it as
      # a `-B` run option, overlaying our binary over the sandbox's baked /app/mira-oxide for
      # every singularity exec. Unset in production, so the baked binary is used.
      MIRA_OXIDE_DEV_BIND: "/opt/mira-oxide-dev/mira-oxide:/app/mira-oxide"
    volumes:
      # Data volume
      - type: bind
        source: ${HOME}/mira-local-data
        target: /data

      # Live MIRA backend + frontend (this repo)
      - type: bind
        source: ./backend
        target: /MIRA/backend
      - type: bind
        source: ./frontend
        target: /MIRA/frontend
      # Keep the image's frontend node_modules (host copy may be absent/wrong arch)
      - type: volume
        target: /MIRA/frontend/node_modules

      # Live Mira-nf pipeline code (sibling repo)
      - type: bind
        source: ../Mira-nf
        target: /MIRA-NF
      # Preserve the image's baked singularity sandboxes, which are NOT in the repo.
      # An anonymous volume seeds itself from the image content at this path.
      - type: volume
        target: /MIRA-NF/sandboxes

      # Live mira-oxide: expose the locally built linux/amd64 binary at a neutral path.
      # singularity binds it over /app/mira-oxide via SINGULARITY_BIND (see environment).
      # Read-only so the container can't clobber it.
      - type: bind
        source: ../mira-oxide/target/dev-linux/mira-oxide
        target: /opt/mira-oxide-dev/mira-oxide
        read_only: true

    working_dir: /data

networks:
  mira:
    name: mira
