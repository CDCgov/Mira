
x-mira-nf-image:
  &mira-nf-image
  cdcgov/mira-nf:v2.2.1

x-data-storage-path:
  &data-storage-path
  /home/snu3/FLU_SC2_SEQUENCING

x-mira-backend-codebase:
  &mira-backend-codebase
  /home/snu3/Connect/MIRA/backend

x-mira-frontend-codebase:
  &mira-frontend-codebase
  /home/snu3/Connect/MIRA/frontend

services:
  mira:
    container_name: mira
    image: mira:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MICROMAMBA_IMAGE: mambaorg/micromamba:2.8.0
        MIRA_NF_IMAGE: *mira-nf-image
        NODE_VERSION: 24
    networks:
      - mira
    privileged: true
    ports:
      - 5175:5175
      - 8080:8080
    restart: always
    volumes:
      - type: bind
        source: *data-storage-path
        target: /data
      - type: bind
        source: *mira-backend-codebase
        target: /MIRA/backend
      - type: bind
        source: *mira-frontend-codebase
        target: /MIRA/frontend
    working_dir: /data

networks:
  mira:
    name: mira
