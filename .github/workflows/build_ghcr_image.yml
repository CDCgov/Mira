name: Build and Push to GHCR

on:
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    name: Check commit message and extract version
    runs-on: ubuntu-latest
    outputs:
      match: ${{ steps.check_msg.outputs.match }}
      version: ${{ steps.check_msg.outputs.version }}
      repo_lc: ${{ steps.check_msg.outputs.repo_lc }}
    steps:
      - name: Check commit message and extract version
        id: check_msg
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          MSG=$(echo "$COMMIT_MSG" | tr '[:upper:]' '[:lower:]')
          if echo "$MSG" | grep -qE "build and push docker image|push and build docker image"; then
            echo "match=true" >> "$GITHUB_OUTPUT"
          else
            echo "match=false" >> "$GITHUB_OUTPUT"
          fi
          VERSION=$(grep -oP 'v[0-9]+\.[0-9]+\.[0-9]+' <<< "$COMMIT_MSG" | head -n1 || true)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "repo_lc=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  build-backend:
    name: Build and Push Backend Image (amd64/arm64)
    needs: prepare
    if: needs.prepare.outputs.match == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Emulation needed to cross-build linux/arm64 on this amd64 runner.
      # NOTE: pin this to a specific commit SHA to match the other actions below.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set image tags
        id: meta
        run: |
          {
            echo "tags<<EOF"
            echo "${{ env.REGISTRY }}/${{ needs.prepare.outputs.repo_lc }}-backend:latest"
            if [ -n "${{ needs.prepare.outputs.version }}" ]; then
              echo "${{ env.REGISTRY }}/${{ needs.prepare.outputs.repo_lc }}-backend:${{ needs.prepare.outputs.version }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          target: backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false

  build-frontend:
    name: Build and Push Frontend Image (amd64/arm64)
    needs: prepare
    if: needs.prepare.outputs.match == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Emulation needed to cross-build linux/arm64 on this amd64 runner.
      # NOTE: pin this to a specific commit SHA to match the other actions below.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set image tags
        id: meta
        run: |
          {
            echo "tags<<EOF"
            echo "${{ env.REGISTRY }}/${{ needs.prepare.outputs.repo_lc }}-frontend:latest"
            if [ -n "${{ needs.prepare.outputs.version }}" ]; then
              echo "${{ env.REGISTRY }}/${{ needs.prepare.outputs.repo_lc }}-frontend:${{ needs.prepare.outputs.version }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          target: frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false