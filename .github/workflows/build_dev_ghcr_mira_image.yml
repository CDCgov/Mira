name: Build Dev MIRA Image and Push to GHCR

on:
  push:
    branches:
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-mira-dev:
    name: Build and Push Dev MIRA Image (${{ matrix.variant }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # Serialize so the amd64 job creates the ghcr package before arm64 pushes to it;
      # concurrent first-time pushes race on package creation and one gets denied.
      max-parallel: 1
      # cdcgov/mira-nf is amd64-only, so both variants are linux/amd64 images. They differ
      # only in the polars build: the amd64 variant keeps the stock (AVX) wheel for native
      # x86-64 hosts; the arm64 variant swaps in polars-lts-cpu so the image runs correctly
      # under Rosetta emulation on Apple Silicon (stock polars SIGSEGVs there).
      matrix:
        include:
          - variant: amd64
            polars_package: ""
          - variant: arm64
            polars_package: "polars-lts-cpu==1.33.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set image tags
        id: meta
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          BASE="${{ env.REGISTRY }}/${GITHUB_REPOSITORY,,}"
          {
            echo "tags<<EOF"
            echo "${BASE}:dev-${VARIANT}"
            # amd64 is the default target, so also publish the unsuffixed dev tag for it.
            if [ "$VARIANT" = "amd64" ]; then
              echo "${BASE}:dev"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push dev MIRA image (${{ matrix.variant }})
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # org.opencontainers.image.source links the GHCR package back to this repository.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=MIRA dev image (${{ matrix.variant }} variant)
          # Mirror the build args from docker-compose.yml so the CI image matches a local
          # `docker compose build`. POLARS_PACKAGE differs per variant (see matrix above).
          build-args: |
            MICROMAMBA_IMAGE=mambaorg/micromamba:2.8.0
            MIRA_NF_IMAGE=cdcgov/mira-nf:v2.2.1
            NODE_VERSION=24
            POLARS_PACKAGE=${{ matrix.polars_package }}
          provenance: false
          cache-from: type=gha,scope=dev-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=dev-${{ matrix.variant }}
