
x-mira-nf-image:
  &mira-nf-image
  cdcgov/mira-nf:v2.2.0

x-data-storage-path:
  &data-storage-path
  /home/snu3/FLU_SC2_SEQUENCING

services:
  mira-nf:
    container_name: mira-nf
    image: *mira-nf-image
    networks:
      - mira-backend
    restart: always
    command: ["tail", "-f", "/dev/null"]  # Keep the container running

  mira-backend:
    container_name: mira-backend
    image: rchau88/mira-backend:latest
    depends_on:
      - mira-nf
    networks:
      - mira-backend
    ports:
      - 8080:8080
    restart: always
    environment:
      HOST_MIRA_NF_IMAGE: *mira-nf-image
      HOST_DATA_STORAGE_PATH: *data-storage-path
    volumes:
      - type: bind
        source: *data-storage-path
        target: /data
      - /var/run/docker.sock:/var/run/docker.sock # Mount the Docker socket to allow the backend container to run Nextflow pipelines
    working_dir: /data
    entrypoint: ["/bin/bash", "-c", "/MIRA-backend/api-kickoff --deploy Docker --data_dir /data --mira_nf_image \"$$HOST_MIRA_NF_IMAGE\""]

networks:
  mira-backend:
    name: mira-backend
