
x-data-storage-path:
  &data-storage-path
  /home/snu3/FLU_SC2_SEQUENCING

x-mira-image:
  &mira-image
  ghcr.io/cdcgov/mira-dev:v3.0.1

services:
  mira:
    container_name: mira
    image: *mira-image
    networks:
      - mira
    privileged: true
    ports:
      - 5174:5175
    restart: always
    volumes:
      - type: bind
        source: *data-storage-path
        target: /data
    working_dir: /data

networks:
  mira:
    name: mira
